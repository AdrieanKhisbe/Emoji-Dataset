[project]
name = "emoji-dataset"
version = "0.1.0"
description = "Emoji artwork and a Unicode index for terminal tools."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3.0",
    "pillow (>=12.3.0,<13.0.0)",
    "click>=8.2,<9",
]

[project.scripts]
emoji = "emoji_dataset.cli:cli"
emoji-build-bundles = "emoji_dataset.bundles:cli"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "emoji_dataset", from = "src"}]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.48.0"
pytest = "^9.1.1"
mypy = "^1.15"
types-requests = "^2.32"

[tool.mypy]
files = ["src/emoji_dataset"]
check_untyped_defs = true

[tool.poe.tasks.typecheck]
cmd = "python -m mypy"
help = "Check CLI and bundle builder types."

[tool.poe.tasks.bundles]
cmd = "emoji-build-bundles"
help = "Build vendor resource archives for a manual GitHub release."

[tool.poe.tasks.local-install]
cmd = "emoji install --vendor apple --local-override resources/dataset"
help = "Install Apple artwork from the local source dataset."

[tool.poe.tasks.regenerate]
cmd = "python src/generate_emoji_dataset.py"
help = "Refresh the Unicode index and vendor artwork from Emojipedia."

[tool.poe.tasks.test]
cmd = "python -m pytest -v"
help = "Test regeneration with simulated HTTP sources and temporary datasets."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

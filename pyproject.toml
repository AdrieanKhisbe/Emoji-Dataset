[project]
name = "emoji-dataset"
description = "Emoji artwork and a Unicode index for terminal tools."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3.0",
    "pillow (>=12.3.0,<13.0.0)",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.48.0"

[tool.poe.tasks.regenerate]
cmd = "python emoji_dataset.py"
help = "Refresh the Unicode index and vendor artwork from Emojipedia."

[tool.poe.tasks.test]
cmd = "python -m unittest discover -s tests -v"
help = "Test regeneration with simulated HTTP sources and temporary datasets."

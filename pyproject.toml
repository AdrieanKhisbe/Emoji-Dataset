[project]
name = "emoji-dataset"
description = "Emoji artwork and a Unicode index for terminal tools."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.13,<5.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.48.0"
requires-poetry = ">=2.0"

[tool.poe.tasks.regenerate]
cmd = "python emoji_dataset.py"
help = "Regenerate the dataset with the legacy scraper (overwrites existing files)."
